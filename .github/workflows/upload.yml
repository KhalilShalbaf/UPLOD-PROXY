name: Ultimate URL Upload Proxy

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک مستقیم فایلی که می‌خواهید آپلود کنید'
        required: true
        type: string

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ⚡ مرحله جدید: checkout کردن مخزن (الزامی برای git push)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Random Filename
        id: filename
        run: |
          ORIGINAL_NAME=$(basename "${{ github.event.inputs.url }}" | sed 's/?.*//' | sed 's/%20/ /g')
          EXTENSION="${ORIGINAL_NAME##*.}"
          if [ "$EXTENSION" = "$ORIGINAL_NAME" ] || [ -z "$EXTENSION" ]; then
            EXTENSION="bin"
          fi
          RANDOM_NUM=$(shuf -i 100000-999999 -n 1)
          NEW_FILENAME="${RANDOM_NUM}.${EXTENSION}"
          
          echo "filename=$NEW_FILENAME" >> "$GITHUB_OUTPUT"
          echo "✅ نام فایل اصلی: $ORIGINAL_NAME"
          echo "✅ نام فایل جدید (تصادفی): $NEW_FILENAME"

      - name: Download and Validate File
        run: |
          echo "در حال دانلود از: ${{ github.event.inputs.url }}"
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               -o "${{ steps.filename.outputs.filename }}" \
               --connect-timeout 30 --max-time 300 \
               "${{ github.event.inputs.url }}"
          
          echo "=== بررسی فایل ==="
          ls -lh "${{ steps.filename.outputs.filename }}"
          file "${{ steps.filename.outputs.filename }}"
          
          FILE_SIZE=$(stat -c%s "${{ steps.filename.outputs.filename }}" 2>/dev/null || echo "0")
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "::error::خطا: فایل دانلود شده بسیار کوچک است ($FILE_SIZE بایت)."
            exit 1
          fi
          
          if file "${{ steps.filename.outputs.filename }}" | grep -qi "HTML"; then
            echo "::error::خطا: فایل دانلود شده یک صفحه وب (HTML) است!"
            exit 1
          fi

      # ==========================================================
      # روش ۱: آپلود در گیت‌هاب (با checkout + PAT)
      # ==========================================================
      - name: Upload to GitHub Raw (Most Reliable)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          BRANCH: proxy-uploads
          FILENAME: ${{ steps.filename.outputs.filename }}
        run: |
          echo "در حال آپلود در گیت‌هاب..."
          
          # استفاده از پوشه فعلی (checkout شده) به جای ساخت پوشه جدید
          mkdir -p uploads
          cp "${FILENAME}" uploads/
          echo "Uploaded via Proxy Workflow on $(date)" > uploads/README.md
          
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          git add uploads/
          git commit -m "Upload: ${FILENAME} - $(date '+%Y-%m-%d %H:%M:%S')"
          
          # ایجاد یا سوئیچ به برنچ
          git checkout -B "${BRANCH}"
          
          # push با توکن
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git
          git push -f origin "${BRANCH}" || {
            echo "::warning::Push با GITHUB_TOKEN شکست خورد، تلاش مجدد..."
            # اگر PAT تنظیم نشده باشد، این بخش fail می‌شود
            exit 1
          }
          
          RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/uploads/${FILENAME}"
          echo ""
          echo "=========================================="
          echo "✅ لینک دانلود مستقیم از گیت‌هاب:"
          echo "${RAW_URL}"
          echo "=========================================="

      # ==========================================================
      # روش ۲: tmpfiles.org (پایدارترین سرویس باقی‌مانده)
      # ==========================================================
      - name: Upload to tmpfiles.org
        continue-on-error: true
        run: |
          echo "=== tmpfiles.org ==="
          RESPONSE=$(curl -s -A "Mozilla/5.0" \
                    --connect-timeout 15 --max-time 120 \
                    -F "file=@${{ steps.filename.outputs.filename }}" \
                    https://tmpfiles.org/api/v1/upload)
          DOWNLOAD_LINK=$(echo "$RESPONSE" | jq -r '.data.url // empty' 2>/dev/null | sed 's|tmpfiles.org/|tmpfiles.org/dl/|')
          if [ -n "$DOWNLOAD_LINK" ]; then
            echo "📎 $DOWNLOAD_LINK"
          else
            echo "⚠️ پاسخ سرور: $RESPONSE"
          fi
          echo ""
          echo "---------------------------------------------------"

      # ==========================================================
      # روش ۳: 0x0.st (سبک و سریع)
      # ==========================================================
      - name: Upload to 0x0.st
        continue-on-error: true
        run: |
          echo "=== 0x0.st ==="
          RESULT=$(curl -s -A "Mozilla/5.0" \
                   --connect-timeout 15 --max-time 120 \
                   -F "file=@${{ steps.filename.outputs.filename }}" \
                   https://0x0.st)
          if [ -n "$RESULT" ] && echo "$RESULT" | grep -q "^https://"; then
            echo " $RESULT"
          else
            echo "️ پاسخ سرور: $RESULT"
          fi
          echo ""
          echo "---------------------------------------------------"

      # ==========================================================
      # روش ۴: catbox.moe (جایگزین پایدار)
      # ==========================================================
      - name: Upload to catbox.moe
        continue-on-error: true
        run: |
          echo "=== catbox.moe ==="
          RESULT=$(curl -s -A "Mozilla/5.0" \
                   --connect-timeout 15 --max-time 120 \
                   -F "fileToUpload=@${{ steps.filename.outputs.filename }}" \
                   -F "reqtype=fileupload" \
                   https://catbox.moe/user/api.php)
          if [ -n "$RESULT" ] && echo "$RESULT" | grep -q "^https://"; then
            echo "📎 $RESULT"
          else
            echo "⚠️ پاسخ سرور: $RESULT"
          fi
          echo ""
          echo "---------------------------------------------------"

      # ==========================================================
      # خلاصه نهایی
      # ==========================================================
      - name: Summary
        run: |
          echo ""
          echo " فرآیند با موفقیت کامل شد!"
          echo ""
          echo "📌 لینک گیت‌هاب (مطمئن‌ترین گزینه):"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/proxy-uploads/uploads/${{ steps.filename.outputs.filename }}"
          echo ""
          echo "💡 سایر لینک‌ها در مراحل بالا نمایش داده شده‌اند."

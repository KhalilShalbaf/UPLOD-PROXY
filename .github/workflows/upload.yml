name: URL Upload Proxy

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک مستقیم فایلی که می‌خواهید آپلود کنید'
        required: true
        type: string

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Random Filename
        id: filename
        run: |
          # استخراج نام اصلی از URL برای پیدا کردن پسوند
          ORIGINAL_NAME=$(basename "${{ github.event.inputs.url }}" | sed 's/?.*//' | sed 's/%20/ /g')
          
          # استخراج پسوند (قسمت بعد از آخرین نقطه)
          EXTENSION="${ORIGINAL_NAME##*.}"
          
          # اگر پسوندی پیدا نشد، از پسوند پیش‌فرض bin استفاده کن
          if [ "$EXTENSION" = "$ORIGINAL_NAME" ] || [ -z "$EXTENSION" ]; then
            EXTENSION="bin"
          fi
          
          # تولید یک عدد تصادفی ۶ رقمی (بین 100000 تا 999999)
          RANDOM_NUM=$(shuf -i 100000-999999 -n 1)
          
          # ساخت نام فایل جدید: عدد تصادفی + پسوند اصلی
          NEW_FILENAME="${RANDOM_NUM}.${EXTENSION}"
          
          echo "filename=$NEW_FILENAME" >> "$GITHUB_OUTPUT"
          echo "✅ نام فایل اصلی: $ORIGINAL_NAME"
          echo "✅ نام فایل جدید (تصادفی): $NEW_FILENAME"

      - name: Download file from URL
        run: |
          echo "در حال دانلود از: ${{ github.event.inputs.url }}"
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o "${{ steps.filename.outputs.filename }}" "${{ github.event.inputs.url }}"
          
          echo "=== بررسی فایل دانلود شده ==="
          ls -lh "${{ steps.filename.outputs.filename }}"
          file "${{ steps.filename.outputs.filename }}"
          
          # بررسی حیاتی: اگر فایل HTML بود، یعنی لینک مستقیم نبوده
          if file "${{ steps.filename.outputs.filename }}" | grep -q "HTML"; then
            echo "::error::خطا: فایل دانلود شده یک صفحه وب (HTML) است! لطفاً لینک مستقیم دانلود را وارد کنید."
            exit 1
          fi

      - name: Upload to tmpfiles.org
        continue-on-error: true
        run:

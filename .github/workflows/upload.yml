name: Ultimate URL Upload Proxy

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک مستقیم فایلی که می‌خواهید آپلود کنید'
        required: true
        type: string

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Setup Random Filename
        id: filename
        run: |
          ORIGINAL_NAME=$(basename "${{ github.event.inputs.url }}" | sed 's/?.*//' | sed 's/%20/ /g')
          EXTENSION="${ORIGINAL_NAME##*.}"
          if [ "$EXTENSION" = "$ORIGINAL_NAME" ] || [ -z "$EXTENSION" ]; then
            EXTENSION="bin"
          fi
          RANDOM_NUM=$(shuf -i 100000-999999 -n 1)
          NEW_FILENAME="${RANDOM_NUM}.${EXTENSION}"
          
          echo "filename=$NEW_FILENAME" >> "$GITHUB_OUTPUT"
          echo "✅ نام فایل اصلی: $ORIGINAL_NAME"
          echo "✅ نام فایل جدید (تصادفی): $NEW_FILENAME"

      - name: Download and Validate File
        run: |
          echo "در حال دانلود از: ${{ github.event.inputs.url }}"
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               -o "${{ steps.filename.outputs.filename }}" \
               --connect-timeout 30 --max-time 300 \
               "${{ github.event.inputs.url }}"
          
          echo "=== بررسی فایل ==="
          ls -lh "${{ steps.filename.outputs.filename }}"
          file "${{ steps.filename.outputs.filename }}"
          
          FILE_SIZE=$(stat -c%s "${{ steps.filename.outputs.filename }}" 2>/dev/null || echo "0")
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "::error::خطا: فایل دانلود شده بسیار کوچک است ($FILE_SIZE بایت). ممکن است لینک اشتباه باشد."
            exit 1
          fi
          
          if file "${{ steps.filename.outputs.filename }}" | grep -qi "HTML"; then
            echo "::error::خطا: فایل دانلود شده یک صفحه وب (HTML) است! لطفاً لینک مستقیم دانلود را وارد کنید."
            exit 1
          fi

      # ==========================================================
      # روش ۱: آپلود در گیت‌هاب (مطمئن‌ترین روش، بدون مسدودی)
      # ==========================================================
      - name: Upload to GitHub Raw (Most Reliable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "در حال آپلود در گیت‌هاب..."
          mkdir -p ./git-repo
          cd ./git-repo
          git init
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          cp "../${{ steps.filename.outputs.filename }}" .
          echo "Uploaded via Proxy Workflow" > README.md
          
          git add .
          git commit -m "Upload: ${{ steps.filename.outputs.filename }} - $(date)"
          git branch -M proxy-uploads
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git push -f origin proxy-uploads
          
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/proxy-uploads/${{ steps.filename.outputs.filename }}"
          echo ""
          echo "=========================================="
          echo "✅ لینک دانلود مستقیم از گیت‌هاب:"
          echo "$RAW_URL"
          echo "=========================================="

      # ==========================================================
      # روش ۲: keep.sh (جایگزین فعال transfer.sh)
      # ==========================================================
      - name: Upload to keep.sh (Transfer.sh Replacement)
        continue-on-error: true
        run: |
          echo "=== keep.sh ==="
          RESULT=$(curl -s -A "Mozilla/5.0" --upload-file "${{ steps.filename.outputs.filename }}" https://keep.sh)
          echo "$RESULT"
          echo ""
          echo "---------------------------------------------------"

      # ==========================================================
      # روش ۳: tmpfiles.org
      # ==========================================================
      - name: Upload to tmpfiles.org
        continue-on-error: true
        run: |
          echo "=== tmpfiles.org ==="
          RESPONSE=$(curl -s -A "Mozilla/5.0" -F "file=@${{ steps.filename.outputs.filename }}" https://tmpfiles.org/api/v1/upload)
          DOWNLOAD_LINK=$(echo "$RESPONSE" | jq -r '.data.url // empty' 2>/dev/null | sed 's|tmpfiles.org/|tmpfiles.org/dl/|')
          if [ -n "$DOWNLOAD_LINK" ]; then
            echo "📎 $DOWNLOAD_LINK"
          else
            echo "⚠️ پاسخ سرور: $RESPONSE"
          fi
          echo ""
          echo "---------------------------------------------------"

      # ==========================================================
      # روش ۴: file.io
      # ==========================================================
      - name: Upload to file.io
        continue-on-error: true
        run: |
          echo "=== file.io ==="
          RESPONSE=$(curl -s -A "Mozilla/5.0" -F "file=@${{ steps.filename.outputs.filename }}" https://file.io)
          LINK=$(echo "$RESPONSE" | jq -r '.link // empty' 2>/dev/null)
          if [ -n "$LINK" ]; then
            echo "📎 $LINK"
          else
            echo "⚠️ پاسخ سرور: $RESPONSE"
          fi
          echo ""
          echo "---------------------------------------------------"

      # ==========================================================
      # روش ۵: 0x0.st (سبک و سریع)
      # ==========================================================
      - name: Upload to 0x0.st
        continue-on-error: true
        run: |
          echo "=== 0x0.st ==="
          RESULT=$(curl -s -A "Mozilla/5.0" -F "file=@${{ steps.filename.outputs.filename }}" https://0x0.st)
          echo "📎 $RESULT"
          echo ""
          echo "---------------------------------------------------"

      # ==========================================================
      # خلاصه نهایی
      # ==========================================================
      - name: Summary
        run: |
          echo ""
          echo " فرآیند با موفقیت کامل شد!"
          echo ""
          echo " لینک گیت‌هاب (مطمئن‌ترین گزینه):"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/proxy-uploads/${{ steps.filename.outputs.filename }}"
          echo ""
          echo "💡 سایر لینک‌ها در مراحل بالا نمایش داده شده‌اند."

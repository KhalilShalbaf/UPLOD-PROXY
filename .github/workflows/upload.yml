name: URL Upload Proxy

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک فایلی که می‌خواهید آپلود کنید'
        required: true
        type: string
      filename:
        description: 'نام فایل (اختیاری - اگر خالی باشد از URL استخراج می‌شود)'
        required: false
        type: string
        default: ''

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup filename
        id: filename
        run: |
          if [ -z "${{ github.event.inputs.filename }}" ]; then
            # استخراج نام فایل از URL
            FILENAME=$(basename "${{ github.event.inputs.url }}" | sed 's/?.*//')
            if [ -z "$FILENAME" ]; then
              FILENAME="download-$(date +%s)"
            fi
          else
            FILENAME="${{ github.event.inputs.filename }}"
          fi
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "نام فایل: $FILENAME"

      - name: Download file from URL
        run: |
          echo "در حال دانلود از: ${{ github.event.inputs.url }}"
          curl -L -o "${{ steps.filename.outputs.filename }}" "${{ github.event.inputs.url }}"
          
          echo "=== بررسی فایل ==="
          ls -lh "${{ steps.filename.outputs.filename }}"
          file "${{ steps.filename.outputs.filename }}"

      - name: Upload to tmpfiles.org
        continue-on-error: true
        run: |
          echo "=== tmpfiles.org ==="
          RESPONSE=$(curl -s -F "file=@${{ steps.filename.outputs.filename }}" https://tmpfiles.org/api/v1/upload)
          echo "$RESPONSE" | jq -r '.data.url' | sed 's|tmpfiles.org/|tmpfiles.org/dl/|'
          echo ""

      - name: Upload to pixeldrain
        continue-on-error: true
        run: |
          echo "=== pixeldrain ==="
          RESPONSE=$(curl -s -F "file=@${{ steps.filename.outputs.filename }}" https://pixeldrain.com/api/file/)
          echo "$RESPONSE" | jq -r '"https://pixeldrain.com/u/" + .id'
          echo ""

      - name: Upload to uguu.se
        continue-on-error: true
        run: |
          echo "=== uguu.se ==="
          curl -s -F "files[]=@${{ steps.filename.outputs.filename }}" https://uguu.se/upload.php | jq -r '.files[0].url'
          echo ""

      - name: Upload to litterbox.catbox.moe
        continue-on-error: true
        run: |
          echo "=== litterbox (1 hour) ==="
          curl -s -F "reqtype=fileupload" -F "time=1h" -F "fileToUpload=@${{ steps.filename.outputs.filename }}" https://litterbox.catbox.moe/resources/internals/api.php
          echo ""

      - name: Upload to catbox.moe (permanent)
        continue-on-error: true
        run: |
          echo "=== catbox.moe (permanent) ==="
          curl -s -F "reqtype=fileupload" -F "fileToUpload=@${{ steps.filename.outputs.filename }}" https://catbox.moe/user/api.php
          echo ""

      - name: Summary
        run: |
          echo ""
          echo "✅ آپلود کامل شد!"
          echo "برای مشاهده لینک‌ها، لاگ مراحل بالا را بررسی کنید."

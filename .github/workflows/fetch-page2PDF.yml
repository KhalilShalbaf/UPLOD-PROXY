name: Fetch Blocked Page to PDF

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس صفحه مسدود شده'
        required: true

jobs:
  fetch_pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Render page and save as PDF
        run: |
          cat > render.js << 'SCRIPT'
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();

            // تنظیم viewport بزرگ برای دیدن محتوای بیشتر
            await page.setViewport({ width: 1280, height: 900 });

            // User-Agent واقعی
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');

            console.log('در حال بارگذاری صفحه...');
            await page.goto(process.env.TARGET_URL, {
              waitUntil: 'networkidle2',
              timeout: 60000
            });

            // صبر اضافی برای لود شدن تصاویر lazy-load
            await new Promise(r => setTimeout(r, 3000));

            // اسکرول به پایین صفحه برای فعال کردن lazy-load تصاویر
            await page.evaluate(async () => {
              await new Promise((resolve) => {
                let totalHeight = 0;
                const distance = 300;
                const timer = setInterval(() => {
                  window.scrollBy(0, distance);
                  totalHeight += distance;
                  if (totalHeight >= document.body.scrollHeight) {
                    clearInterval(timer);
                    resolve();
                  }
                }, 100);
              });
            });

            // صبر برای لود شدن تصاویر بعد از اسکرول
            await new Promise(r => setTimeout(r, 3000));

            // برگشت به بالای صفحه
            await page.evaluate(() => window.scrollTo(0, 0));

            console.log('در حال ساخت PDF...');
            await page.pdf({
              path: 'page.pdf',
              format: 'A4',
              printBackground: true,
              margin: { top: '10mm', bottom: '10mm', left: '10mm', right: '10mm' }
            });

            // همچنین یک screenshot کامل بگیریم
            await page.screenshot({
              path: 'page.png',
              fullPage: true
            });

            // متن صفحه را هم استخراج کنیم
            const text = await page.evaluate(() => document.body.innerText);
            require('fs').writeFileSync('page.txt', text);

            await browser.close();
            console.log('✅ تمام شد!');
          })();
          SCRIPT

          TARGET_URL="${{ inputs.url }}" node render.js

      - name: Verify files
        run: |
          echo "=== فایل‌های تولید شده ==="
          ls -lh page.pdf page.png page.txt
          echo "========================="

      - name: Push to web-archive branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir archive
          cd archive
          git init
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          cp ../page.pdf .
          cp ../page.png .
          cp ../page.txt .

          echo "# آرشیو صفحه وب" > README.md
          echo "" >> README.md
          echo "**منبع:** ${{ inputs.url }}" >> README.md
          echo "" >> README.md
          echo "**تاریخ:** $(date)" >> README.md
          echo "" >> README.md
          echo "## فایل‌ها:" >> README.md
          echo "- [📄 دانلود PDF](page.pdf)" >> README.md
          echo "- [🖼️ دانلود تصویر کامل](page.png)" >> README.md
          echo "- [📝 متن ساده](page.txt)" >> README.md

          git add .
          git commit -m "Archive PDF: $(date)"
          git branch -M web-archive
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git push -f origin web-archive

      - name: Show download links
        run: |
          echo "============================================="
          echo "✅ صفحه با موفقیت به PDF تبدیل شد!"
          echo "============================================="
          echo ""
          echo "📄 دانلود PDF (با تصاویر):"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/web-archive/page.pdf"
          echo ""
          echo "🖼️ دانلود تصویر کامل صفحه:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/web-archive/page.png"
          echo ""
          echo "📝 متن ساده:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/web-archive/page.txt"
          echo ""
          echo "📖 مشاهده در گیت‌هاب:"
          echo "https://github.com/${{ github.repository }}/tree/web-archive"
          echo "============================================="